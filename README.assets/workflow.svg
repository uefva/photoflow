<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="408" viewBox="0 0 1200 408" role="img" aria-label="photoflow 工作流：建批次、分发、修图、导出、归档">
<rect width="1200" height="408" fill="#ffffff"/>
<text x="48" y="58" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="26" fill="#1f2937" font-weight="700" text-anchor="start" letter-spacing="0">一次拍摄的完整流程</text>
<text x="48" y="86" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">蓝色由脚本完成，橙色需要你操作。每一步都先预演，确认清单后再落地。</text>
<rect x="48" y="122" width="200" height="186" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
<circle cx="78" cy="154" r="14" fill="#eff6ff"/>
<text x="78" y="159" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" fill="#2563eb" font-weight="700" text-anchor="middle" letter-spacing="0">1</text>
<text x="102" y="160" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="17" fill="#1f2937" font-weight="700" text-anchor="start" letter-spacing="0">建批次</text>
<line x1="68" y1="180" x2="228" y2="180" stroke="#f3f4f6" stroke-width="1.5"/>
<text x="68" y="204" font-family="ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace" font-size="12.5" fill="#374151" font-weight="500" text-anchor="start" letter-spacing="0">photoflow new</text>
<text x="68" y="232" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">一次建好四个同名目录</text>
<text x="68" y="252" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">省掉手打四遍</text>
<rect x="68" y="268" width="42" height="22" rx="11.0" fill="#eff6ff"/><text x="89.0" y="283.0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11.5" fill="#2563eb" font-weight="600" text-anchor="middle" letter-spacing="0">脚本</text>
<line x1="254" y1="214" x2="269" y2="214" stroke="#cbd5e1" stroke-width="1.5"/>
<path d="M269 214 l-5 -3.4 v6.8 z" fill="#cbd5e1"/>
<rect x="276" y="122" width="200" height="186" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
<circle cx="306" cy="154" r="14" fill="#eff6ff"/>
<text x="306" y="159" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" fill="#2563eb" font-weight="700" text-anchor="middle" letter-spacing="0">2</text>
<text x="330" y="160" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="17" fill="#1f2937" font-weight="700" text-anchor="start" letter-spacing="0">从卡分发</text>
<line x1="296" y1="180" x2="456" y2="180" stroke="#f3f4f6" stroke-width="1.5"/>
<text x="296" y="204" font-family="ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace" font-size="12.5" fill="#374151" font-weight="500" text-anchor="start" letter-spacing="0">photoflow ingest</text>
<text x="296" y="232" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">按扩展名自动分流</text>
<text x="296" y="252" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">RAW → 04   JPG → 05</text>
<rect x="296" y="268" width="42" height="22" rx="11.0" fill="#eff6ff"/><text x="317.0" y="283.0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11.5" fill="#2563eb" font-weight="600" text-anchor="middle" letter-spacing="0">脚本</text>
<line x1="482" y1="214" x2="497" y2="214" stroke="#cbd5e1" stroke-width="1.5"/>
<path d="M497 214 l-5 -3.4 v6.8 z" fill="#cbd5e1"/>
<rect x="504" y="122" width="200" height="186" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
<circle cx="534" cy="154" r="14" fill="#fffbeb"/>
<text x="534" y="159" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" fill="#b45309" font-weight="700" text-anchor="middle" letter-spacing="0">3</text>
<text x="558" y="160" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="17" fill="#1f2937" font-weight="700" text-anchor="start" letter-spacing="0">选片修图</text>
<line x1="524" y1="180" x2="684" y2="180" stroke="#f3f4f6" stroke-width="1.5"/>
<text x="524" y="204" font-family="ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace" font-size="12.5" fill="#b45309" font-weight="500" text-anchor="start" letter-spacing="0">Lightroom Classic</text>
<text x="524" y="232" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">从 04 读 RAW</text>
<text x="524" y="252" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">选片、调色、降噪</text>
<rect x="524" y="268" width="42" height="22" rx="11.0" fill="#fffbeb"/><text x="545.0" y="283.0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11.5" fill="#b45309" font-weight="600" text-anchor="middle" letter-spacing="0">你</text>
<line x1="710" y1="214" x2="725" y2="214" stroke="#cbd5e1" stroke-width="1.5"/>
<path d="M725 214 l-5 -3.4 v6.8 z" fill="#cbd5e1"/>
<rect x="732" y="122" width="200" height="186" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
<circle cx="762" cy="154" r="14" fill="#fffbeb"/>
<text x="762" y="159" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" fill="#b45309" font-weight="700" text-anchor="middle" letter-spacing="0">4</text>
<text x="786" y="160" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="17" fill="#1f2937" font-weight="700" text-anchor="start" letter-spacing="0">导出成品</text>
<line x1="752" y1="180" x2="912" y2="180" stroke="#f3f4f6" stroke-width="1.5"/>
<text x="752" y="204" font-family="ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace" font-size="12.5" fill="#b45309" font-weight="500" text-anchor="start" letter-spacing="0">导出预设</text>
<text x="752" y="232" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">文件名自动带 -ed</text>
<text x="752" y="252" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">直接落到 03</text>
<rect x="752" y="268" width="42" height="22" rx="11.0" fill="#fffbeb"/><text x="773.0" y="283.0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11.5" fill="#b45309" font-weight="600" text-anchor="middle" letter-spacing="0">你</text>
<line x1="938" y1="214" x2="953" y2="214" stroke="#cbd5e1" stroke-width="1.5"/>
<path d="M953 214 l-5 -3.4 v6.8 z" fill="#cbd5e1"/>
<rect x="960" y="122" width="200" height="186" rx="14" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
<circle cx="990" cy="154" r="14" fill="#eff6ff"/>
<text x="990" y="159" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" fill="#2563eb" font-weight="700" text-anchor="middle" letter-spacing="0">5</text>
<text x="1014" y="160" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="17" fill="#1f2937" font-weight="700" text-anchor="start" letter-spacing="0">归档原图</text>
<line x1="980" y1="180" x2="1140" y2="180" stroke="#f3f4f6" stroke-width="1.5"/>
<text x="980" y="204" font-family="ui-monospace, SFMono-Regular, Consolas, 'Courier New', monospace" font-size="12.5" fill="#374151" font-weight="500" text-anchor="start" letter-spacing="0">photoflow archive</text>
<text x="980" y="232" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">已修原图 05 → 99</text>
<text x="980" y="252" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12.5" fill="#6b7280" font-weight="400" text-anchor="start" letter-spacing="0">没修的原地不动</text>
<rect x="980" y="268" width="42" height="22" rx="11.0" fill="#eff6ff"/><text x="1001.0" y="283.0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11.5" fill="#2563eb" font-weight="600" text-anchor="middle" letter-spacing="0">脚本</text>
<text x="48" y="366" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13" fill="#9ca3af" font-weight="400" text-anchor="start" letter-spacing="0">脚本从不覆盖已有文件，也从不猜测；遇到不确定的情况只报告，等你判断。</text>
</svg>